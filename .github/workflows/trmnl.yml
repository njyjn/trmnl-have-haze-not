name: trmnl

on:
  # Pull requests are never filtered: every change gets the full checks.
  pull_request:
  # Pushes to main deploy, so skip the ones that cannot affect the screen --
  # otherwise a README typo re-uploads the plugin to TRMNL. A commit touching
  # both prose and the plugin still runs, since not all of its paths are
  # ignored.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Map block is in sync with its inputs
        run: |
          python3 tools/build_map.py
          git diff --exit-code src/shared.liquid

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Lint plugin
        run: |
          docker run --rm --volume "$PWD:/plugin" trmnl/trmnlp lint

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Without an id:, every push would create a brand new plugin rather
      # than updating the existing one. Fail loudly instead.
      - name: Plugin id is set
        run: grep -qE '^id:' src/settings.yml

      - name: Push to TRMNL
        env:
          TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
        # --force: push confirms overwriting server settings via
        # $stdin.gets, which is nil with no TTY and crashes the run.
        run: docker run --rm -e TRMNL_API_KEY --volume "$PWD:/plugin" trmnl/trmnlp push --force
