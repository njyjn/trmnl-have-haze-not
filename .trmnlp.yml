---
# Local dev-server config. Not uploaded to TRMNL.
#
# NOTE: `trmnlp serve` rewrites this file when you change a value in the
# preview's Custom Fields picker, so expect it to show up in `git status`
# after a preview session. Keep the committed value matching the `default:`
# in src/settings.yml.
watch:
  - .trmnlp.yml
  - src

custom_fields:
  # Read from the environment, never written here: this file is committed and
  # `serve` rewrites it from the Custom Fields picker. Put the token in
  # .env.local (gitignored) and `set -a; . ./.env.local; set +a` before serving.
  aqicn_token: "{{ env.AQICN_API_TOKEN }}"
  scale: US AQI
  home_region: Central

framework_version: latest
time_zone: Asia/Singapore

# This plugin has no transform -- all derivation happens in Liquid so it runs
# on any TRMNL plan.
transform_runtime: disabled
