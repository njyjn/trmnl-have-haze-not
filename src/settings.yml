#
# Uploaded to TRMNL by `trmnlp push`. Add an `id:` after the first push so
# subsequent pushes update the same plugin instead of creating a new one.
#
# Two polling URLs, newline separated. TRMNL exposes them as IDX_0 / IDX_1,
# and wraps an array-rooted response as `.data` -- see src/shared.liquid.
#   IDX_0  data.gov.sg real-time PSI (NEA), five Singapore regions
#   IDX_1  Open-Meteo air quality: [0] Singapore 24h forecast, [1..4] cities
# Neither API needs a key. Keep the city order in step with `city_names`
# in src/shared.liquid.
#
---
strategy: polling
name: Singapore Air Quality
description: PSI map, pollutants, forecast
polling_verb: get
polling_url: |-
  https://api-open.data.gov.sg/v2/real-time/api/psi
  https://air-quality-api.open-meteo.com/v1/air-quality?latitude=1.3521,3.139,-6.2088,13.7563,14.5995&longitude=103.8198,101.6869,106.8456,100.5018,120.9842&current=us_aqi,pm2_5&hourly=pm2_5,us_aqi&forecast_hours=24&past_hours=0&timezone=Asia%2FSingapore
polling_headers: ''
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
framework_version: latest
refresh_interval: 15

custom_fields:
- keyname: home_region
  field_type: select
  name: Home region
  description: Which NEA reporting region drives the headline reading
  options:
  - Central
  - North
  - South
  - East
  - West
  default: Central
